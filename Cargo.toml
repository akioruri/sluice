[workspace]
resolver = "3"
members = ["crates/sluice-core", "crates/sluice-server", "crates/sluice-cli"]
exclude = ["frontend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# --- async runtime ---
tokio = { version = "1", default-features = false, features = ["full"] }

# --- HTTP ---
axum = { version = "0.8", default-features = false, features = [
    "json",
    "macros",
    "tokio",
    "http1",
    "http2",
] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server-auto",
    "client-legacy",
] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }

# --- reqwest (rustls, streaming) ---
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "rustls-tls-webpki-roots",
    "stream",
    "http2",
    "json",
    "gzip",
    "brotli",
    "deflate",
] }

# --- database ---
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "migrate",
    "chrono",
    "uuid",
    "macros",
] }

# --- crypto ---
aes-gcm = "0.11"
argon2 = "0.5"
sha2 = "0.10"
subtle = "2.6"
base64 = "0.22"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# --- tracing ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "registry",
] }

# --- cli ---
clap = { version = "4", features = ["derive"] }

# --- testing ---
wiremock = "0.6"
tokio-test = "0.4"
bytes = "1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
